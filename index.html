<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIKKE 洗詞條模擬器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="masthead">
        <h1>洗詞條模擬器</h1>
        <nav class="tabs" role="tablist">
            <button role="tab" data-tab="sim" aria-selected="true">模擬</button>
            <button role="tab" data-tab="calc" aria-selected="false">期望計算</button>
            <button role="tab" data-tab="ref" aria-selected="false">階級表</button>
        </nav>
    </header>

    <main>
        <!-- 模擬 -->
        <section id="tab-sim" class="tab active">
            <div class="ledger">
                <div class="res">
                    <span class="res-name"><i class="dot stone"></i>石頭</span>
                    <b id="spentStones">0</b>
                    <span id="leftStones" class="res-left"></span>
                    <label>預算 <input type="number" id="inputStones" min="0" inputmode="numeric" placeholder="不限"></label>
                </div>
                <div class="res">
                    <span class="res-name"><i class="dot key"></i>鑰匙</span>
                    <b id="spentKeys">0</b>
                    <span id="leftKeys" class="res-left"></span>
                    <label>預算 <input type="number" id="inputKeys" min="0" inputmode="numeric" placeholder="不限"></label>
                </div>
                <div class="ledger-actions">
                    <button class="btn solid" id="btnSummary">查看詞條總和</button>
                    <button class="btn ghost" id="btnResetAll">全部重置</button>
                </div>
            </div>
            <div id="gear" class="gear"></div>
        </section>

        <!-- 期望計算 -->
        <section id="tab-calc" class="tab">
            <div class="calc">
                <div class="calc-form">
                    <h2>要洗幾件</h2>
                    <div class="row">
                        <select id="calcPieces"><option value="1">1 件</option><option value="2">2 件</option><option value="3">3 件</option><option value="4" selected>4 件（整套）</option></select>
                    </div>
                    <div id="calcCurrentWrap" hidden>
                        <h2>這件現在的詞條</h2>
                        <div id="calcCurrent"></div>
                    </div>

                    <h2>想要的詞條</h2>
                    <div class="row presets">
                        <button class="btn ghost" data-preset="0">只要優越</button>
                        <button class="btn ghost" data-preset="0,3">優越 + 攻擊</button>
                    </div>
                    <p class="hint">「每件都要」是每件裝備各一條。「另外」是整套合計幾條，分在哪幾件都可以，例如爆傷 2、爆率 1、彈藥 1。</p>
                    <div class="tgrid" id="calcTargets"></div>
                    <p class="hint" id="calcCount"></p>
                    <div class="row">
                        <label for="calcRuns">模擬次數</label>
                        <select id="calcRuns">
                            <option value="1000">1,000</option>
                            <option value="5000" selected>5,000</option>
                            <option value="20000">20,000</option>
                        </select>
                    </div>
                    <button class="btn solid wide" id="btnCalc">開始計算</button>
                </div>
                <div class="calc-out">
                    <h2>各策略總共要花的石頭</h2>
                    <div id="calcResult"><p class="hint">設定目標後按「開始計算」。會比較 5 種鎖定方式 × 2 種保留方式，數字是所有件數加起來的總花費。</p></div>
                </div>
            </div>
        </section>

        <!-- 階級表 -->
        <section id="tab-ref" class="tab">
            <div class="table-wrap"><table id="refTable"></table></div>
        </section>
    </main>

    <dialog id="rollDialog">
        <h2 id="rollTitle"></h2>
        <div class="versus">
            <div><h3>目前效果</h3><div id="rollOld"></div><p class="mass" id="massOld"></p></div>
            <div><h3>變更效果</h3><div id="rollNew"></div><p class="mass" id="massNew"></p></div>
        </div>
        <p class="hint" id="rollTip"></p>
        <div class="dialog-actions">
            <button class="btn ghost" id="btnKeep">效果維持</button>
            <button class="btn solid" id="btnTake">效果變更</button>
        </div>
    </dialog>

    <dialog id="sumDialog">
        <h2>詞條總和</h2>
        <div class="verdict"><div id="scoreTitle"></div><div id="scoreQuote"></div></div>
        <div id="sumList"></div>
        <p class="hint" id="sumCost"></p>
        <div class="dialog-actions"><button class="btn solid" id="btnSumClose">關閉</button></div>
    </dialog>

    <div id="toast" role="status" aria-live="polite"></div>

    <script src="engine.js"></script>
    <script src="app.js"></script>
</body>
</html>
